spring:
  application:
    name: X-Judge

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/X-Judge?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:judge}
    password: ${SPRING_DATASOURCE_PASSWORD:judge}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jmx:
    enabled: true

  mvc:
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:4200"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

  flyway:
    enabled: true
    locations: classpath:db/migration
